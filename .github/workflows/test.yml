name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run AEGIS Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: |
          python -m pytest AEGIS-Tests/ -v --tb=short

      - name: Run Knowledge Compiler smoke test
        run: |
          python aegis/AEGIS-Compiler/build.py

      - name: Run Kernel boot smoke test
        run: |
          python aegis/AEGIS-Runtime/kernel_runner.py --task "CI smoke test"
